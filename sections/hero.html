<!-- ==========================================
     RASTER · Hero Section
     Sits on Top of the Unified Page-Wide Swiss Grid
========================================== -->
<section id="hero" class="relative z-10 bg-transparent pt-6 sm:pt-8 lg:pt-10 pb-16 lg:pb-24">
  <div class="max-w-[1560px] mx-auto px-4 sm:px-8 lg:px-12 xl:px-16">
    
    <!-- Monumental Editorial Header -->
    <div class="mb-10 lg:mb-14">
      
      <!-- Giant Headline: Simply, Better Coffee (Orange) + Period (Dark Slate) -->
      <div class="mb-6 lg:mb-8 overflow-hidden pb-4 sm:pb-6">
        <h1 id="hero-title" class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-[5.5rem] 2xl:text-[6.5rem] font-extrabold text-[#E9631A] tracking-[-0.035em] leading-[1.02] pb-2 select-none">
          <span>Simply, Better Coffee</span><span class="text-[#162B31]">.</span>
        </h1>
      </div>

      <!-- Architectural Editorial Sub-Grid: Aligned with "Simply, Better Coffee" -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6 lg:gap-12 items-baseline">
        
        <!-- Left Column: Punchline (Natural Case, No All-Caps) -->
        <div id="hero-sub-left" class="md:col-span-5 lg:col-span-4">
          <p class="text-xs sm:text-sm font-bold text-[#315762] leading-relaxed">
            No complicated gimmicks. Ethically sourced, roasted fresh weekly.
          </p>
        </div>

        <!-- Right Column: Harmonized Flowing Statement -->
        <div id="hero-sub-right" class="md:col-span-7 lg:col-span-8 md:pl-4 lg:pl-8">
          <p class="text-sm sm:text-base lg:text-lg text-[#315762] leading-relaxed max-w-2xl">
            We strip away the noise to focus on what truly matters in your cup: transparent direct-trade beans, balanced roast profiles, and a consistently clean brew crafted for your daily ritual.
          </p>
        </div>

      </div>

    </div>

    <!-- Cards Row: Tightly Packed (gap-2 to gap-3), Tall Portrait Images (aspect-[3/4]), Pure Visual Filmstrip (2 cols on mobile, 4 cols on desktop) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-2.5 lg:gap-3 items-start" id="hero-gallery-row">
      
      <!-- Card 01: Product (Artisanal Stoneware Flat White) -->
      <div class="group flex flex-col hero-plate">
        <div class="aspect-[3/4] overflow-hidden rounded-none bg-transparent shadow-none">
          <img 
            id="hero-img-1"
            src="./images/hero-1-product.jpg" 
            alt="Artisanal stoneware cup of flat white with delicate latte art on dark walnut table" 
            class="hero-plate-img w-full h-full object-cover grayscale-[5%] contrast-[105%] group-hover:scale-[1.03] transition-transform duration-500"
          />
        </div>
      </div>

      <!-- Card 02: Spatial Interior (Cast Concrete Monolithic Bar & Tall Windows) -->
      <div class="group flex flex-col hero-plate">
        <div class="aspect-[3/4] overflow-hidden rounded-none bg-transparent shadow-none">
          <img 
            id="hero-img-2"
            src="./images/hero-2-interior.jpg" 
            alt="Minimalist urban cafe interior featuring cast-concrete bar and tall glass windows" 
            class="hero-plate-img w-full h-full object-cover grayscale-[5%] contrast-[105%] group-hover:scale-[1.03] transition-transform duration-500"
          />
        </div>
      </div>

      <!-- Card 03: Barista Craft (Precision Gooseneck Pour Over) -->
      <div class="group flex flex-col hero-plate">
        <div class="aspect-[3/4] overflow-hidden rounded-none bg-transparent shadow-none">
          <img 
            id="hero-img-3"
            src="./images/hero-3-craft.jpg" 
            alt="Barista hands pouring hot water from matte black kettle into pour-over dripper" 
            class="hero-plate-img w-full h-full object-cover grayscale-[5%] contrast-[105%] group-hover:scale-[1.03] transition-transform duration-500"
          />
        </div>
      </div>

      <!-- Card 04: Lifestyle (Iced Dirty Latte & Open Design Magazine in Quiet Corner) -->
      <div class="group flex flex-col hero-plate">
        <div class="aspect-[3/4] overflow-hidden rounded-none bg-transparent shadow-none">
          <img 
            id="hero-img-4"
            src="./images/hero-4-lifestyle.jpg" 
            alt="Iced dirty latte with espresso marbling beside open architectural magazine" 
            class="hero-plate-img w-full h-full object-cover grayscale-[5%] contrast-[105%] group-hover:scale-[1.03] transition-transform duration-500"
          />
        </div>
      </div>

    </div>

  </div>
</section>
