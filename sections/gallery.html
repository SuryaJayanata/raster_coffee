<!-- ==========================================
     RASTER · Section: Gallery & Space
     Asymmetric Swiss Editorial Layout
     Sits on Top of the Unified Page-Wide Swiss Grid
========================================== -->
<section id="gallery" class="relative z-10 bg-transparent py-16 lg:py-24">
  <div class="max-w-[1560px] mx-auto px-4 sm:px-8 lg:px-12 xl:px-16">
    
    <!-- Section Header: Clean Minimalist Editorial -->
    <div class="mb-10 lg:mb-14">
      <span id="gallery-tag" class="text-sm font-bold text-[#E9631A] block mb-3">
        Gallery
      </span>
      <div class="overflow-hidden pb-2 sm:pb-3">
        <h2 id="gallery-title" class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-[#162B31] tracking-tight leading-[1.12]">
          Atmosphere & Space<span class="text-[#E9631A]">.</span>
        </h2>
      </div>
    </div>

    <!-- Asymmetric Editorial Gallery Grid (Strictly Aligned with Swiss Grid) -->
    <div class="space-y-6 sm:space-y-8">
      
      <!-- Tier 1: Asymmetric Split (7 cols wide landscape + 5 cols balanced) -->
      <div id="gallery-tier-1" class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 items-start">
        
        <!-- Plate 01: Main Coffee Bar (7 cols) -->
        <div class="gallery-plate lg:col-span-7 bg-white p-2.5 rounded-none border border-[#315762]/20 group overflow-hidden">
          <div class="aspect-[16/10] overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-1-bar.jpg" 
              alt="Main coffee bar counter and seating at Raster" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Main Coffee Bar</span>
            <span>Tlogomas, Malang</span>
          </div>
        </div>

        <!-- Plate 02: Barista Pour Over (5 cols) -->
        <div class="gallery-plate lg:col-span-5 bg-white p-2.5 rounded-none border border-[#315762]/20 group overflow-hidden">
          <div class="aspect-[16/10] lg:aspect-[4/3] overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-2-pour.jpg" 
              alt="Barista brewing manual filter pour over" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Manual Filter Pour</span>
            <span>Slow Brew Bar</span>
          </div>
        </div>

      </div>

      <!-- Tier 2: 3-Column Detail Rhythm (4 cols + 4 cols + 4 cols) -->
      <div id="gallery-tier-2" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 items-start">
        
        <!-- Plate 03: Ceramic Cup Detail (4 cols) -->
        <div class="gallery-plate bg-white p-2.5 rounded-none border border-[#315762]/20 group overflow-hidden">
          <div class="aspect-square overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-3-cup.jpg" 
              alt="Ceramic cup with latte art on wooden table" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Daily Flat White</span>
            <span>East Java Beans</span>
          </div>
        </div>

        <!-- Plate 04: Garden Patio (4 cols) -->
        <div class="gallery-plate bg-white p-2.5 rounded-none border border-[#315762]/20 group overflow-hidden">
          <div class="aspect-square overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-4-patio.jpg" 
              alt="Outdoor leafy patio seating" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Outdoor Patio</span>
            <span>Fresh Air & Greenery</span>
          </div>
        </div>

        <!-- Plate 05: Fresh Roasted Beans (4 cols) -->
        <div class="gallery-plate bg-white p-2.5 rounded-none border border-[#315762]/20 group sm:col-span-2 lg:col-span-1 overflow-hidden">
          <div class="aspect-square overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-5-cooling.jpg" 
              alt="Freshly roasted specialty coffee beans" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Roaster Cooling Tray</span>
            <span>Weekly Small Batch</span>
          </div>
        </div>

      </div>

      <!-- Tier 3: Inverted Asymmetric Split (5 cols medium landscape + 7 cols wide landscape) -->
      <div id="gallery-tier-3" class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 items-start">
        
        <!-- Plate 06: Communal Desk (5 cols) -->
        <div class="gallery-plate lg:col-span-5 bg-white p-2.5 rounded-none border border-[#315762]/20 group overflow-hidden">
          <div class="aspect-[16/10] lg:aspect-[4/3] overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-6-desk.jpg" 
              alt="Communal work table with coffee and notebook" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Communal Work Table</span>
            <span>Quiet & Outlets</span>
          </div>
        </div>

        <!-- Plate 07: Roastery Vault (7 cols) -->
        <div class="gallery-plate lg:col-span-7 bg-white p-2.5 rounded-none border border-[#315762]/20 group overflow-hidden">
          <div class="aspect-[16/10] overflow-hidden rounded-none bg-[#162B31]">
            <img 
              src="./images/gallery-7-roaster.jpg" 
              alt="Coffee roasting staging area and roasted coffee bags" 
              class="gallery-img w-full h-full object-cover grayscale-[10%] contrast-[105%] group-hover:scale-[1.02] transition-transform duration-500 will-change-transform"
              loading="lazy"
            />
          </div>
          <div class="p-3.5 flex items-center justify-between text-xs text-[#315762] border-t border-[#315762]/15 mt-2">
            <span class="font-bold text-[#162B31] group-hover:text-[#E9631A] transition-colors">Roasting Area</span>
            <span>Packaging & Storage</span>
          </div>
        </div>

      </div>

    </div>

  </div>
</section>
