<!-- ==========================================
     RASTER · Navigation Bar (100% Transparent Floating Masthead)
     No Background, Unified Grid Passes Through to the Very Top
     Zero Collision with Hero Typography
========================================== -->
<header class="relative z-20 bg-transparent transition-all duration-200">
  <div class="max-w-[1560px] mx-auto px-4 sm:px-8 lg:px-12 xl:px-16">
    <div class="grid grid-cols-2 md:grid-cols-12 items-center h-20 sm:h-24">
      
      <!-- Left Column: Slashed Navigation Links (Desktop) -->
      <nav class="hidden md:flex md:col-span-5 items-center gap-3 text-xs font-semibold tracking-wide text-[#315762]" aria-label="Left Navigation">
        <a href="#about" class="swiss-link py-1">
          About
        </a>
        <span class="text-[#315762]/30 select-none">/</span>
        <a href="#roast-spec" class="swiss-link py-1">
          Coffee Beans
        </a>
        <span class="text-[#315762]/30 select-none">/</span>
        <a href="#menu" class="swiss-link py-1">
          Menu
        </a>
      </nav>

      <!-- Center Column: RASTER Logo (Geometric Grid Mark + Wordmark) -->
      <div class="flex items-center justify-start md:justify-center md:col-span-2">
        <a href="#hero" class="inline-flex items-center gap-2.5 group focus:outline-none focus-visible:ring-1 focus-visible:ring-[#E9631A]">
          <!-- Geometric Swiss Grid Matrix Icon (Raster Concept) -->
          <svg class="w-5 h-5 text-[#E9631A] group-hover:rotate-90 transition-transform duration-300 shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7.5" height="7.5" />
            <rect x="13.5" y="3" width="7.5" height="7.5" />
            <rect x="3" y="13.5" width="7.5" height="7.5" />
            <rect x="13.5" y="13.5" width="7.5" height="7.5" />
          </svg>
          <!-- Bold Brand Wordmark -->
          <span class="text-xl sm:text-2xl font-black tracking-[-0.03em] text-[#162B31] group-hover:text-[#E9631A] transition-colors">
            RASTER
          </span>
        </a>
      </div>

      <!-- Right Column: Secondary Links & Sharp Orange CTA Button (No Rounded) -->
      <div class="flex items-center justify-end md:col-span-5 gap-4 lg:gap-6">
        
        <!-- Secondary Slashed Links (Desktop) -->
        <nav class="hidden lg:flex items-center gap-3 text-xs font-semibold tracking-wide text-[#315762]" aria-label="Right Navigation">
          <a href="#gallery" class="swiss-link py-1">
            Gallery
          </a>
          <span class="text-[#315762]/30 select-none">/</span>
          <a href="#visit" class="swiss-link py-1">
            Location
          </a>
        </nav>

        <!-- Sharp Orange CTA Button with Architectural Charcoal Shutter & Arrow Glide -->
        <a href="#roast-spec" class="relative inline-flex items-center justify-center gap-2 bg-[#E9631A] text-white text-xs font-bold tracking-wide px-4 sm:px-5 py-2.5 sm:py-3 rounded-none overflow-hidden group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#162B31] active:scale-[0.98] transition-transform">
          <!-- Background Shutter Wipe (Deep Charcoal #162B31 from Bottom) -->
          <span class="absolute inset-0 bg-[#162B31] translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] pointer-events-none"></span>
          
          <!-- Button Label & Kinetic Arrow Glide -->
          <span class="relative z-10 inline-flex items-center gap-1.5">
            <span>Order Beans</span>
            <i class="ph ph-arrow-right text-xs transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] group-hover:translate-x-1"></i>
          </span>
        </a>

      </div>

    </div>
  </div>
</header>
