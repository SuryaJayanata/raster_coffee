<!-- ==========================================
     RASTER · Section: Minimalist CTA Card
     Placed Below Location / Map Section & Above Footer
     Pure Architectural Card: Headline & CTA Button Only
========================================== -->
<section id="cta" class="relative z-10 bg-transparent py-8 sm:py-12 lg:py-14">
  <div class="max-w-[1560px] mx-auto px-4 sm:px-8 lg:px-12 xl:px-16">
    
    <!-- Minimalist Card: Headline + Button Only -->
    <div class="bg-white p-8 sm:p-12 lg:p-14 rounded-none border border-[#315762]/20 flex flex-col md:flex-row md:items-center justify-between gap-6 sm:gap-8">
      
      <!-- Headline Text -->
      <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-[#162B31] tracking-tight leading-[1.15] max-w-2xl">
        Ready to brew better coffee at home<span class="text-[#E9631A]">?</span>
      </h2>

      <!-- CTA Button -->
      <div class="shrink-0">
        <a 
          href="#roast-spec" 
          class="relative inline-flex items-center justify-center gap-2 bg-[#E9631A] text-white text-xs sm:text-sm font-bold tracking-wide px-7 py-4 rounded-none overflow-hidden group active:scale-[0.98] transition-transform"
        >
          <span class="absolute inset-0 bg-[#162B31] translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] pointer-events-none"></span>
          <span class="relative z-10 inline-flex items-center gap-2">
            <span>Order Beans</span>
            <i class="ph ph-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1"></i>
          </span>
        </a>
      </div>

    </div>

  </div>
</section>
